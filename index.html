<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://auth.privy.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://auth.privy.io; img-src 'self' data: https:; connect-src 'self' https: wss: ws: https://auth.privy.io; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://auth.privy.io; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>ChatScan.fun - See through the noise.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Enhanced polyfill for Node.js modules in browser
      if (typeof global === 'undefined') {
        window.global = globalThis;
      }
      
      // Fix setImmediate polyfill conflict with Privy
      if (typeof setImmediate === 'undefined') {
        window.setImmediate = function(callback, ...args) {
          return setTimeout(callback, 0, ...args);
        };
      }
      
      if (typeof clearImmediate === 'undefined') {
        window.clearImmediate = function(id) {
          return clearTimeout(id);
        };
      }
      
      // Suppress Privy embedded wallet postMessage errors without interfering with functionality
      const originalJSONParse = JSON.parse;
      JSON.parse = function(text, reviver) {
        try {
          return originalJSONParse.call(this, text, reviver);
        } catch (error) {
          // Suppress JSON parsing errors from Privy embedded wallets
          const errorMessage = error?.message || error?.toString() || '';
          if (errorMessage.includes('setImmedia') || 
              (error instanceof SyntaxError && errorMessage.includes('Unexpected token'))) {
            console.warn('Suppressed Privy embedded wallet JSON parsing error');
            return {}; // Return empty object instead of throwing
          }
          throw error;
        }
      };
      
      // Global error handler for JSON parsing issues
      window.addEventListener('error', function(event) {
        if (event.message && event.message.includes('setImmedia') && event.message.includes('JSON')) {
          console.warn('Suppressed Privy JSON parsing error:', event.message);
          event.preventDefault();
          return false;
        }
      });
      
      // Handle unhandled promise rejections - catch Privy JSON parsing errors
      window.addEventListener('unhandledrejection', function(event) {
        const error = event.reason;
        const errorMessage = error?.message || error?.toString() || '';
        const isSyntaxError = error instanceof SyntaxError;
        
        // Suppress Privy embedded wallet JSON parsing errors
        if (errorMessage.includes('setImmedia') || 
            (errorMessage.includes('Unexpected token') && errorMessage.includes('is not valid JSON')) ||
            (isSyntaxError && errorMessage.includes('JSON'))) {
          console.warn('Suppressed Privy embedded wallet error:', errorMessage);
          event.preventDefault();
          event.stopPropagation();
          return false;
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
